name: autometa
x-app: &app
  image: autometa-production:local
  pull_policy: never
  init: true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'
x-service-env: &service-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-autometa}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-autometa}?connection_limit=5&connect_timeout=3&socket_timeout=3
  REDIS_URL: redis://redis:6379
services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autometa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-autometa}
    volumes: [postgres-data:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-bookworm
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    volumes: [redis-data:/data]
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    restart: 'no'
    command: [npm, run, db:migrate]
    environment: *service-env
    depends_on:
      postgres: { condition: service_healthy }
  api:
    <<: *app
    build:
      context: ..
      dockerfile: backend/infrastructure/docker/Dockerfile
    command: [node, dist/api/src/main.js]
    env_file: .env
    environment: *service-env
    volumes: ['.local/backup-status:/backup-status:ro']
    ports: ['127.0.0.1:${API_PUBLISHED_PORT:-4000}:4000']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:4000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
  worker:
    <<: *app
    command: [node, dist/worker/src/main.js]
    env_file: .env
    healthcheck:
      test: [CMD, node, dist/scripts/worker-health.js]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    environment: *service-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  web:
    <<: *app
    working_dir: /app/users
    command: [npm, run, start]
    environment:
      NODE_ENV: production
      INTERNAL_API_BASE_URL: http://api:4000/api/v1
      APP_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    ports: ['127.0.0.1:${WEB_PUBLISHED_PORT:-3000}:3000']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 12
  admin:
    <<: *app
    working_dir: /app/admin
    command: [npm, run, start]
    environment:
      NODE_ENV: production
      INTERNAL_API_BASE_URL: http://api:4000/api/v1
      APP_ORIGIN: ${ADMIN_ORIGIN:-http://localhost:3200}
    ports: ['127.0.0.1:${ADMIN_PUBLISHED_PORT:-3200}:3000']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 12

  backups:
    image: autometa-backups:local
    build:
      context: ..
      dockerfile: backend/infrastructure/backup/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-autometa}
      PGDATABASE: ${POSTGRES_DB:-autometa}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?Run npm run ops:configure}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-14}
    volumes: ['.local/backups:/backups', '.local/backup-status:/status']
    tmpfs: ['/tmp:rw,nosuid,noexec,size=512m']
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "const fs=require('fs');try{const s=JSON.parse(fs.readFileSync('/status/backup.json'));if(!s.ok||Date.now()-s.lastSuccess>93600000)process.exit(1)}catch{process.exit(1)}",
        ]
      interval: 60s
      timeout: 5s
      start_period: 2m
      retries: 2
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
  monitoring:
    image: prom/prometheus:v3.13.5
    restart: unless-stopped
    command:
      [
        --config.file=/etc/prometheus/prometheus.yml,
        --storage.tsdb.path=/prometheus,
        --storage.tsdb.retention.time=15d,
      ]
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - monitoring-data:/prometheus
    secrets: [monitoring_token]
    ports: ['127.0.0.1:${MONITORING_PUBLISHED_PORT:-9090}:9090']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:9090/-/ready]
      interval: 15s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

secrets:
  monitoring_token:
    file: .local/monitoring/token

volumes:
  postgres-data:
  redis-data:
  monitoring-data:
