global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: autometa
    metrics_path: /api/v1/health/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/monitoring_token
    static_configs:
      - targets: ['api:4000']
